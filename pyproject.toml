[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpp"
version = "0.1.0"
description = "Myocardia Prediction Project"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "threadpoolctl>=3.6,<4",
    "xgboost>=3.0,<4",
    "torch>=2.8,<3",
    "scipy==1.18.1",
    "seaborn==0.13.2",
    "matplotlib==3.11.2",
    "ipykernel",
    "ipywidgets",
]

[tool.setuptools.packages.find]
where = ["src"]
